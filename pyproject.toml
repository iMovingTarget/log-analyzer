[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
dynamic = ["version"]
description = "Security log analysis CLI: parses SSH and web access logs, flags brute-force activity, and writes JSON, CSV, HTML and SIEM-ready JSONL output."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sergei Papp" }]
requires-python = ">=3.10"
keywords = ["security", "logs", "ssh", "nginx", "apache", "siem", "brute-force", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
geoip = ["geoip2>=4.0"]
mysql = ["mysql-connector-python>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/iMovingTarget/log_analyzer"
Issues = "https://github.com/iMovingTarget/log_analyzer/issues"

[project.scripts]
log-analyzer = "log_analyzer.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "log_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.format]
line-ending = "lf"
